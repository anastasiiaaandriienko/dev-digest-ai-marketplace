name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Structure lint and its tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint (scripts/validate-marketplace.mjs)
        run: npm run validate
      - name: Lint and index tests
        run: npm test

  claude-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Only the validator is used here: it reads manifests and makes no model calls,
      # so no API key is needed. The CLI version is pinned so --strict behaves the same
      # in CI and locally; bump it deliberately together with COMPATIBILITY.md.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.306
      - name: Validate the marketplace
        run: claude plugin validate . --strict
      - name: Validate the release channels
        run: |
          for dir in channels/*/; do
            echo "::group::$dir"
            claude plugin validate "$dir" --strict
            echo "::endgroup::"
          done
      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            echo "::group::$dir"
            claude plugin validate "$dir" --strict
            echo "::endgroup::"
          done

  build-site:
    name: Build catalog site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags feed releases.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build (index + type check + bundle)
        run: npm run build
